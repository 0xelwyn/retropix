<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- Orynth Ownership Verification Tag -->
  <meta name="ory-verify" content="orynth-c7aace79913648eb858b28a0e017958b">
  
  <title>RetroPix Pro — 8-Bit Pixel Art & Sprite Studio</title>
  
  <style>
    :root {
      --bg-color: #0d0f17;
      --panel-bg: #161925;
      --accent-cyan: #00f0ff;
      --accent-pink: #ff0055;
      --accent-green: #39ff14;
      --text-main: #e2e8f0;
      --border-color: #2a2e45;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    header {
      text-align: center;
      margin-bottom: 15px;
    }

    header h1 {
      font-size: 1.8rem;
      color: var(--accent-cyan);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
      letter-spacing: 2px;
    }

    header p {
      font-size: 0.85rem;
      color: var(--accent-pink);
    }

    .app-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
      max-width: 500px;
    }

    .canvas-wrapper {
      position: relative;
      background-color: #000;
      border: 3px solid var(--accent-cyan);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
      border-radius: 6px;
      padding: 5px;
    }

    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
      cursor: crosshair;
      background-color: #111;
    }

    .controls-panel {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-size: 0.8rem;
      color: var(--accent-cyan);
      text-transform: uppercase;
      font-weight: bold;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    button {
      background: #1f2438;
      color: var(--text-main);
      border: 1px solid var(--accent-cyan);
      padding: 10px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover, button:active {
      background: var(--accent-cyan);
      color: #000;
      box-shadow: 0 0 8px var(--accent-cyan);
    }

    button.btn-pink {
      border-color: var(--accent-pink);
    }

    button.btn-pink:hover, button.btn-pink:active {
      background: var(--accent-pink);
      color: #fff;
      box-shadow: 0 0 8px var(--accent-pink);
    }

    button.btn-green {
      border-color: var(--accent-green);
    }

    button.btn-green:hover, button.btn-green:active {
      background: var(--accent-green);
      color: #000;
      box-shadow: 0 0 8px var(--accent-green);
    }

    .palette-container {
      display: flex;
      gap: 6px;
      justify-content: space-between;
      margin-top: 5px;
    }

    .color-swatch {
      width: 100%;
      height: 32px;
      border-radius: 4px;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .color-swatch.active {
      border-color: #fff;
      transform: scale(1.05);
      box-shadow: 0 0 5px #fff;
    }

    footer {
      margin-top: 20px;
      font-size: 0.75rem;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>RETROPIX PRO</h1>
    <p>8-BIT PROCEDURAL SPRITE STUDIO</p>
  </header>

  <div class="app-container">
    <div class="canvas-wrapper">
      <canvas id="pixelCanvas" width="320" height="320"></canvas>
    </div>

    <div class="controls-panel">
      <div class="control-group">
        <label>Palette Selection</label>
        <div class="palette-container" id="palette">
          <div class="color-swatch active" style="background-color: #00f0ff;" data-color="#00f0ff"></div>
          <div class="color-swatch" style="background-color: #ff0055;" data-color="#ff0055"></div>
          <div class="color-swatch" style="background-color: #39ff14;" data-color="#39ff14"></div>
          <div class="color-swatch" style="background-color: #ffbe0b;" data-color="#ffbe0b"></div>
          <div class="color-swatch" style="background-color: #ffffff;" data-color="#ffffff"></div>
          <div class="color-swatch" style="background-color: #000000;" data-color="#000000"></div>
        </div>
      </div>

      <div class="control-group">
        <label>Actions</label>
        <div class="btn-grid">
          <button id="btnGenerate" class="btn-pink">⚡ GENERATE</button>
          <button id="btnClear">🧹 CLEAR</button>
          <button id="btnExport" class="btn-green">💾 EXPORT PNG</button>
          <button id="btnSymmetry">🔄 SYMMETRY: ON</button>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>Built by @BasedElwyn • Powered by Orynth</p>
  </footer>

  <script>
    const canvas = document.getElementById('pixelCanvas');
    const ctx = canvas.getContext('2d');
    const gridSize = 16;
    const pixelSize = canvas.width / gridSize;
    let grid = Array(gridSize).fill().map(() => Array(gridSize).fill('#000000'));
    let currentColor = '#00f0ff';
    let isSymmetryEnabled = true;
    let isDrawing = false;

    // Initialize Canvas
    function init() {
      drawGrid();
      setupEventListeners();
    }

    function renderCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          ctx.fillStyle = grid[r][c];
          ctx.fillRect(c * pixelSize, r * pixelSize, pixelSize, pixelSize);
        }
      }
      drawGridOverlay();
    }

    function drawGridOverlay() {
      ctx.strokeStyle = '#2a2e45';
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= gridSize; i++) {
        ctx.beginPath();
        ctx.moveTo(i * pixelSize, 0);
        ctx.lineTo(i * pixelSize, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * pixelSize);
        ctx.lineTo(canvas.width, i * pixelSize);
        ctx.stroke();
      }
    }

    function setPixel(x, y, color) {
      const col = Math.floor(x / pixelSize);
      const row = Math.floor(y / pixelSize);
      if (row >= 0 && row < gridSize && col >= 0 && col < gridSize) {
        grid[row][col] = color;
        if (isSymmetryEnabled) {
          const mirrorCol = gridSize - 1 - col;
          grid[row][mirrorCol] = color;
        }
      }
      renderCanvas();
    }

    function generateProceduralSprite() {
      const colors = ['#00f0ff', '#ff0055', '#39ff14', '#ffbe0b', '#000000'];
      const primaryColor = colors[Math.floor(Math.random() * (colors.length - 1))];
      
      // Reset grid
      grid = Array(gridSize).fill().map(() => Array(gridSize).fill('#000000'));

      const halfGrid = Math.ceil(gridSize / 2);
      for (let r = 2; r < gridSize - 2; r++) {
        for (let c = 2; c < halfGrid; c++) {
          if (Math.random() > 0.45) {
            grid[r][c] = primaryColor;
            grid[r][gridSize - 1 - c] = primaryColor;
          }
        }
      }
      renderCanvas();
    }

    function setupEventListeners() {
      // Color selection
      document.querySelectorAll('.color-swatch').forEach(swatch => {
        swatch.addEventListener('click', (e) => {
          document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
          e.target.classList.add('active');
          currentColor = e.target.getAttribute('data-color');
        });
      });

      // Canvas Draw Events
      const handlePointer = (e) => {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = clientX - rect.left;
        const y = clientY - rect.top;
        setPixel(x, y, currentColor);
      };

      canvas.addEventListener('mousedown', (e) => { isDrawing = true; handlePointer(e); });
      canvas.addEventListener('mousemove', (e) => { if (isDrawing) handlePointer(e); });
      window.addEventListener('mouseup', () => { isDrawing = false; });

      canvas.addEventListener('touchstart', (e) => { isDrawing = true; handlePointer(e); });
      canvas.addEventListener('touchmove', (e) => { if (isDrawing) handlePointer(e); });
      window.addEventListener('touchend', () => { isDrawing = false; });

      // Action Buttons
      document.getElementById('btnGenerate').addEventListener('click', generateProceduralSprite);
      
      document.getElementById('btnClear').addEventListener('click', () => {
        grid = Array(gridSize).fill().map(() => Array(gridSize).fill('#000000'));
        renderCanvas();
      });

      document.getElementById('btnSymmetry').addEventListener('click', (e) => {
        isSymmetryEnabled = !isSymmetryEnabled;
        e.target.innerText = `🔄 SYMMETRY: ${isSymmetryEnabled ? 'ON' : 'OFF'}`;
      });

      document.getElementById('btnExport').addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = `retropix-sprite-${Date.now()}.png`;
        link.href = canvas.toDataURL();
        link.click();
      });
    }

    // Run application
    init();
    generateProceduralSprite();
  </script>
</body>
</html>
